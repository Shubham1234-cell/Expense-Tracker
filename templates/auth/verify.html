{% extends "base.html" %}
{% block title %}Verify Account - FinTrack{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-full">
    <div class="w-full max-w-md p-8 space-y-6 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700">
        <div class="text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-brand-100 dark:bg-brand-900 mb-4">
                <i class="fas fa-envelope-open-text text-brand-600 dark:text-brand-400 text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Check your email</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">
                We've sent a 6-digit verification code to <br>
                <span class="font-medium text-gray-800 dark:text-gray-200">{{ user.email }}</span>
            </p>
        </div>
        
        <form class="space-y-6" method="POST" action="">
            <div>
                <label for="otp" class="sr-only">Verification Code</label>
                <input id="otp" name="otp" type="text" maxlength="6" required pattern="\d{6}"
                    class="mt-1 block w-full px-4 py-3 text-center text-2xl tracking-[0.5em] font-mono bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition duration-150"
                    placeholder="------">
            </div>
            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transform transition hover:-translate-y-0.5">
                    Verify Account
                </button>
            </div>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                Didn't receive the code? 
                <a href="{{ url_for('auth.resend_otp', user_id=user.id) }}" class="font-medium text-brand-600 hover:text-brand-500 transition-colors">
                    Resend Code
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
